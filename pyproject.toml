[project]
name = "averta"
version = "0.1.0"
description = "CPU-native failure prediction for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "polars>=1.0",
    "duckdb>=1.1",
    "typer>=0.15",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mcp>=1.2",
]

[project.scripts]
averta = "averta.cli:app"
averta-mcp = "averta.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/averta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as function-call defaults by design.
"src/averta/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
