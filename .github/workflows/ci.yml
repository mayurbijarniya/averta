name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # xgboost needs an OpenMP runtime; the macOS equivalent is `brew install libomp`.
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q

      # The leakage suite is the one that must never be allowed to fail
      # quietly: it is what makes every reported metric trustworthy.
      - name: Leakage guards
        run: pytest tests/test_leakage.py -q --no-header
